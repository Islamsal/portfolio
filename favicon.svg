<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="Eso Brand Mark">
  <style>
    :root {
      --eso-fg: #09090b;       /* Zinc 950: Deep, near-black for light mode */
      --eso-bg: transparent;
      --eso-glow: rgba(9, 9, 11, 0.15);
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --eso-fg: #fafafa;     /* Zinc 50: Crisp off-white for dark mode */
        --eso-glow: rgba(250, 250, 250, 0.25);
      }
    }

    .bar {
      fill: var(--eso-fg);
      /* Spring-like cubic-bezier for a tactile, "mechanical" feel */
      transition: x 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), 
                  filter 0.3s ease;
    }

    .bar-middle {
      x: 35; /* Recessed state: embodies "low overhead" */
    }

    /* Interactive State: System Active */
    svg:hover .bar-middle {
      x: 15; /* Extends to full width, filling the negative space */
    }

    /* Subtle terminal-glow effect in dark mode on interaction */
    @media (prefers-color-scheme: dark) {
      svg:hover .bar {
        filter: drop-shadow(0 0 6px var(--eso-glow));
      }
    }
  </style>
  
  <!-- Top Bar: Structural anchor -->
  <rect class="bar" x="15" y="12" width="70" height="16" rx="8" />
  
  <!-- Middle Bar: The "Low Overhead" variable element -->
  <rect class="bar bar-middle" x="35" y="42" width="50" height="16" rx="8" />
  
  <!-- Bottom Bar: Structural anchor -->
  <rect class="bar" x="15" y="72" width="70" height="16" rx="8" />
</svg>
